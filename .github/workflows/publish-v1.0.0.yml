name: Publish rutrix v1.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'maas3n/rutrix'
    runs-on: ubuntu-latest
    steps:
      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          # rutrix v1.0.0

          First stable release of rutrix for Debian 13 (Trixie).

          ## Included

          - rTorrent 0.16.22 with matching libtorrent 0.16.22
          - bundled tinyxml2 XMLRPC backend
          - ruTorrent web interface
          - nginx + PHP 8.4 FPM
          - HTTPS with a self-signed certificate
          - nginx Basic Auth per managed user
          - one systemd rTorrent service per user
          - Unix-domain SCGI socket between ruTorrent and rTorrent
          - safe install, uninstall, and purge lifecycle with per-user provenance state
          - pinned standalone bootstrap for reproducible installation

          ## Validated on Debian 13

          The v1.0.0 installer and management lifecycle were tested on a real Debian 13 system, including:

          - fresh rutrix-managed user creation
          - rTorrent 0.16.22 service start and restart
          - ruTorrent connectivity through the Unix SCGI socket
          - ruTorrent environment checks with all required checks passing
          - actual torrent add/use and persistence across rTorrent service restart
          - uninstall preserving the Unix account and complete home directory
          - state transition from installed=1 to installed=0
          - purge eligibility after uninstall
          - guarded purge deleting only a rutrix-created account, its home, and rutrix state

          ## Install

          ```bash
          wget https://raw.githubusercontent.com/maas3n/rutrix/main/rutrix.sh
          chmod +x rutrix.sh
          sudo ./rutrix.sh
          ```

          After installation, run:

          ```bash
          sudo rutrix
          ```

          ## Supported platform

          Debian 13 (Trixie).

          Release target: `1509a5f4436dc0f0356ff7f231f4bbfe8f9913fd`.
          EOF

          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target 1509a5f4436dc0f0356ff7f231f4bbfe8f9913fd \
            --title "rutrix v1.0.0" \
            --notes-file /tmp/release-notes.md
