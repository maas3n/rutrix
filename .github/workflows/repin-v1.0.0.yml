name: Repin hardened rutrix v1.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repin:
    if: github.event.head_commit.message == 'Repin hardened rutrix v1.0.0 release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Pin and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_tree=48ca93f9099ef048847831b9986092e66be7f710
          sed -i "s/^BOOTSTRAP_COMMIT=\"[0-9a-f]\{40\}\"$/BOOTSTRAP_COMMIT=\"$target_tree\"/" rutrix.sh
          grep -q "^BOOTSTRAP_COMMIT=\"$target_tree\"$" rutrix.sh
          bash -n rutrix.sh

          git config user.name "maas3n"
          git config user.email "291940012+maas3n@users.noreply.github.com"
          git rm .github/workflows/repin-v1.0.0.yml
          git add rutrix.sh
          git commit -m "Pin v1.0.0 bootstrap to hardened tree"
          release_target=$(git rev-parse HEAD)
          git push origin main

          git tag -f v1.0.0 "$release_target"
          git push --force origin refs/tags/v1.0.0

          cat > /tmp/notes.md <<EOF
          # rutrix v1.0.0

          Stable Debian 13 (Trixie) release of rutrix.

          ## Included

          - rTorrent 0.16.22 with matching libtorrent 0.16.22
          - bundled tinyxml2 XMLRPC backend
          - ruTorrent + nginx + PHP 8.4 FPM
          - APT repository preflight before Unix-user creation or modification
          - UID-bound purge provenance and username-reuse protection
          - canonical-path, owner-UID and mount/submount checks before destructive home removal
          - mandatory rTorrent service-stop verification before teardown
          - staged, validated and root-owned /etc/rutrix replacement with rollback handling
          - uninstall with account/home preservation and provenance-guarded PURGE

          ## Install

          \`\`\`bash
          wget https://raw.githubusercontent.com/maas3n/rutrix/main/rutrix.sh
          chmod +x rutrix.sh
          sudo ./rutrix.sh
          \`\`\`

          Release target: \`$release_target\`.
          EOF

          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq .id)
          body=$(cat /tmp/notes.md)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f body="$body" \
            -f target_commitish="$release_target" \
            -f name='rutrix v1.0.0' \
            -f make_latest='true' >/dev/null
