name: Refresh rutrix v1.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh v1.0.0 release tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Validate corrected v1.0.0 tree
        shell: bash
        run: |
          set -euo pipefail
          bash -n rutrix.sh
          bash -n scripts/install-user
          bash -n scripts/install-rtorrent-0.16.22
          grep -q '^VERSION="1.0.0"$' rutrix.sh
          grep -q 'Checking APT package repositories' scripts/install-user
          grep -q 'APT repository update failed. No rutrix Unix user has been created or modified.' scripts/install-user
          grep -q 'APT repository preflight before Unix-user creation or modification' README.md

      - name: Finalize clean tree and move v1.0.0 tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "maas3n"
          git config user.email "291940012+maas3n@users.noreply.github.com"
          git rm .github/workflows/refresh-v1.0.0.yml
          git commit -m "Finalize rutrix v1.0.0 release tree"
          git push origin main
          target=$(git rev-parse HEAD)
          git tag -f v1.0.0 "$target"
          git push --force origin refs/tags/v1.0.0
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Refresh existing v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.release.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          # rutrix v1.0.0

          Stable Debian 13 (Trixie) release of rutrix.

          ## Included

          - rTorrent 0.16.22 with matching libtorrent 0.16.22
          - bundled tinyxml2 XMLRPC backend
          - ruTorrent web interface
          - nginx + PHP 8.4 FPM
          - HTTPS with a self-signed certificate
          - nginx Basic Auth per managed user
          - one systemd rTorrent service per user
          - Unix-domain SCGI socket between ruTorrent and rTorrent
          - safe install, uninstall and provenance-guarded purge lifecycle
          - pinned standalone bootstrap
          - APT repository preflight before Unix-user creation or modification

          ## APT safety

          rutrix validates configured APT repositories before creating or modifying a dedicated Unix user. If an unrelated third-party repository fails `apt-get update`, installation stops before creating a partial rutrix account.

          ## Validated on Debian 13

          The installer and management lifecycle were tested on a real Debian 13 system, including user creation, rTorrent 0.16.22 service operation, ruTorrent connectivity, torrent persistence across service restart, uninstall with home preservation, state transitions, and guarded purge.

          ## Install

          \`\`\`bash
          wget https://raw.githubusercontent.com/maas3n/rutrix/main/rutrix.sh
          chmod +x rutrix.sh
          sudo ./rutrix.sh
          \`\`\`

          Release target: \`$TARGET\`.
          EOF

          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq .id)
          body=$(cat /tmp/release-notes.md)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f tag_name='v1.0.0' \
            -f target_commitish="$TARGET" \
            -f name='rutrix v1.0.0' \
            -f body="$body" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest='true' >/dev/null
