name: Fix rutrix v1.0.0 release notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix v1.0.0 release notes formatting'
    runs-on: ubuntu-latest
    steps:
      - name: Fix v1.0.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          # rutrix v1.0.0

          Stable Debian 13 (Trixie) release of rutrix.

          ## Included

          - rTorrent 0.16.22 with matching libtorrent 0.16.22
          - bundled tinyxml2 XMLRPC backend
          - ruTorrent web interface
          - nginx + PHP 8.4 FPM
          - HTTPS with a self-signed certificate
          - nginx Basic Auth per managed user
          - one systemd rTorrent service per user
          - Unix-domain SCGI socket between ruTorrent and rTorrent
          - safe install, uninstall and provenance-guarded purge lifecycle
          - pinned standalone bootstrap
          - APT repository preflight before Unix-user creation or modification

          ## APT safety

          rutrix validates configured APT repositories before creating or modifying a dedicated Unix user. If an unrelated third-party repository fails `apt-get update`, installation stops before creating a partial rutrix account.

          ## Validated on Debian 13

          The installer and management lifecycle were tested on a real Debian 13 system, including user creation, rTorrent 0.16.22 service operation, ruTorrent connectivity, torrent persistence across service restart, uninstall with home preservation, state transitions, and guarded purge.

          ## Install

          ```bash
          wget https://raw.githubusercontent.com/maas3n/rutrix/main/rutrix.sh
          chmod +x rutrix.sh
          sudo ./rutrix.sh
          ```

          Release target: `0a318f28ef408c321b1389d5568fa437caeee9df`.
          EOF

          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" --jq .id)
          body=$(cat /tmp/release-notes.md)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -f body="$body" \
            -f target_commitish='0a318f28ef408c321b1389d5568fa437caeee9df' \
            -f name='rutrix v1.0.0' \
            -f make_latest='true' >/dev/null
