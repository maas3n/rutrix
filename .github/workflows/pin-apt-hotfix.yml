name: Pin rutrix APT preflight hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Pin hotfix tree
        shell: bash
        run: |
          set -euo pipefail
          target=e29b65a5e91c011cb6f3f5559a39dba0b492f4f1
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('rutrix.sh')
          s = p.read_text()
          s2, n = re.subn(r'^BOOTSTRAP_COMMIT="[0-9a-f]{40}"$', 'BOOTSTRAP_COMMIT="e29b65a5e91c011cb6f3f5559a39dba0b492f4f1"', s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('BOOTSTRAP_COMMIT line not found')
          p.write_text(s2)
          PY
          if git diff --quiet -- rutrix.sh; then
            echo "bootstrap already pinned"
            exit 0
          fi
          git config user.name "maas3n"
          git config user.email "291940012+maas3n@users.noreply.github.com"
          git add rutrix.sh
          git commit -m "Pin bootstrap to APT preflight hotfix"
          git push
